<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 ImageGrab - 图片画廊</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🖼️</span>
      <span>图提取 ImageGrab</span>
      <span class="count-badge" id="countBadge">0 张图片</span>
    </div>
    <div class="actions">
      <button id="selectAllBtn" class="btn">全选</button>
      <button id="invertBtn" class="btn">反选</button>
      <span class="selected-info" id="selectedInfo">已选 0 张</span>
      <button id="downloadBtn" class="btn primary">下载选中</button>
    </div>
  </header>

  <div class="source-url" id="sourceUrl"></div>

  <main class="grid" id="grid">
    <div class="empty" id="emptyTip">暂无图片，请先在电商详情页点击右下角「获取图片」按钮。</div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="gallery.js"></script>
</body>
</html>
